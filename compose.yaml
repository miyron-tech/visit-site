services:
  portfolio:
    build: .
    ports:
      - '${PORTFOLIO_PORT:-4300}:3000'
    environment:
      DATABASE_URL: file:/app/data/profile.db
      PORT: 3000
    volumes:
      - profile-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
volumes:
  profile-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${PORTFOLIO_SUBNET:-10.202.0.0/24}
